name: CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-
      - name: Install dependencies
        env:
          YARN_ENABLE_HARDENED_MODE: false
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
      - name: Generate coverage
        run: yarn cover
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage/lcov.info

  windows:
    runs-on: windows-latest
    env:
      GYP_MSVS_VERSION: 2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - name: Install dependencies
        env:
          YARN_ENABLE_HARDENED_MODE: false
        run: yarn install --immutable --network-timeout 600000
      - run: yarn verify

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - name: Install dependencies
        env:
          YARN_ENABLE_HARDENED_MODE: false
        run: yarn install --immutable --network-timeout 600000
      - run: yarn verify


  appveyor:
    if: ${{ github.event_name == 'push' }}
    name: Wait for the AppVeyor (Windows) build
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the AppVeyor build of this commit
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          slug="randytarampi/pseudoimage"
          echo "Waiting for the AppVeyor build of ${sha}"
          for i in $(seq 1 45); do
            response=$(mktemp)
            trap 'rm -f "$response"' EXIT
            curl -sf --max-time 30 "https://ci.appveyor.com/api/projects/${slug}" > "$response" || true
            status=$(SHA="$sha" python3 - "$response" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as response:
              data = json.load(response)
          build = data.get("build") or {}
          print(build.get("status") or "notfound" if (build.get("commitId") or "").lower() == os.environ["SHA"].lower() else "notfound")
          PY
            ) || status=notfound
            echo "poll ${i}: ${status}"
            case "$status" in
              success) exit 0 ;;
              failed|error|cancelled) echo "::error::AppVeyor build ${status} for ${sha}"; exit 1 ;;
            esac
            sleep 60
          done
          echo "::error::AppVeyor build for ${sha} did not finish in 45 minutes"
          exit 1
